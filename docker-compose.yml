services:
  db:
    image: postgres:18
    container_name: financas-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: financas
    ports:
      - "5432:5432"
    volumes:
      # a partir da imagem 18 o volume vai em /var/lib/postgresql (não mais .../data)
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d financas"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
